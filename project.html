<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Détails d'un projet d'Ivann Seri Gnoleba">
  <title>Projet | Ivan.DEV</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="project-page">
  <div class="bg-grid"></div>
  <nav class="navbar">
    <div class="container">
      <a href="index.html#projects" class="logo">Ivan<span class="dot">.DEV</span></a>
      <a href="index.html#projects" class="back-link"><i class="fas fa-arrow-left"></i> Retour aux projets</a>
    </div>
  </nav>
  <main class="project-detail container">
    <p class="glitch-text">PROJECT DETAILS</p>
    <h1 id="project-title">Chargement...</h1>
    <p id="project-type" class="status finished"></p>
    <div class="project-detail-grid">
      <div class="detail-preview" id="project-preview"></div>
      <div class="detail-content">
        <h2>Description</h2>
        <p id="project-description"></p>
        <h2>Technologies</h2>
        <div id="project-tech" class="tech-stack"></div>
        <h2>Fonctionnalités</h2>
        <ul id="project-features" class="feature-list"></ul>
        <div class="detail-actions">
          <a id="live-link" class="btn btn-primary" href="#" target="_blank" rel="noopener"><i class="fas fa-eye"></i> Voir le site</a>
          <a id="github-link" class="btn btn-secondary" href="#" target="_blank" rel="noopener"><i class="fab fa-github"></i> Code GitHub</a>
        </div>
      </div>
    </div>
  </main>
  <footer><div class="container"><p>&copy; 2026 Ivan.DEV</p></div></footer>
  <script src="project.js"></script>
</body>
</html>
